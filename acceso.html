<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso — HUMAN-CORE System</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#002060" />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Mulish:wght@400;600;700&family=Archivo:wght@600;700&display=swap" />
<style>
  :root{
    --navy:#002060;--navy-deep:#001233;--gold:#c2a36b;--gold-deep:#a8854c;
    --cream:#f7f3ec;--ink:#111a30;--body:#414961;--taupe:#857c6c;--line:#e6dfd1;
    --rojo:#8c2f28;--r-lg:30px;--r-pill:999px;--ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;min-width:0;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 100% at 15% 0%, #0b3179 0%, var(--navy) 50%, var(--navy-deep) 100%);
    font-family:Mulish,system-ui,sans-serif;color:var(--body);font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;padding:20px;}
  .caja{background:#fff;border-radius:var(--r-lg);padding:46px 42px;max-width:440px;width:100%;
    text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);}
  .caja img{width:56px;display:block;margin:0 auto 20px;}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;color:var(--ink);
    font-size:34px;margin:0 0 8px;font-style:normal;line-height:1.1;}
  p.sub{margin:0 0 26px;color:var(--taupe);font-size:15.5px;}
  label{display:block;text-align:left;font-family:Archivo,sans-serif;font-size:10.5px;
    letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--navy);margin:0 0 8px;}
  input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--cream);
    border:1px solid var(--line);border-radius:14px;padding:15px 18px;outline:none;}
  input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,32,96,.16);background:#fff;}
  #codigo{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:34px;
    letter-spacing:.35em;text-align:center;padding:12px 6px 12px 18px;}
  button{width:100%;margin-top:16px;font-family:Archivo,sans-serif;font-weight:700;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--navy);border:0;
    border-radius:var(--r-pill);padding:17px 20px;cursor:pointer;transition:background .3s var(--ease),transform .3s var(--ease);}
  button:hover{background:#0b3179;transform:translateY(-1px);}
  button[disabled]{opacity:.6;cursor:wait;transform:none;}
  .aviso{display:none;margin:18px 0 0;font-size:14.5px;border-radius:14px;padding:14px 16px;text-align:left;}
  .aviso.ok{background:#eef6ee;color:#2c5e2e;}
  .aviso.mal{background:#faeeed;color:var(--rojo);}
  .liga{display:inline-block;margin-top:18px;font-size:13.5px;color:var(--taupe);text-decoration:underline;
    background:none;border:0;padding:0;width:auto;cursor:pointer;font-family:inherit;letter-spacing:0;text-transform:none;}
  .liga:hover{color:var(--navy);background:none;transform:none;}
  .regreso{display:inline-block;margin-top:22px;font-size:13px;color:var(--taupe);text-decoration:none;}
  .regreso:hover{color:var(--navy);}
  #paso2{display:none;}
</style>
</head>
<body>
<main class="caja">
  <img src="/assets/logo-navy-sm.webp" alt="HUMAN-CORE" width="56" height="56" />
  <h1>Tu panel</h1>

  <div id="paso1">
    <p class="sub">Escribe tu correo y te mandamos un código de 6 dígitos. Sin contraseñas.</p>
    <form id="f1">
      <label for="email">Tu correo</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="tucorreo@ejemplo.com" />
      <button id="b1" type="submit">Mandarme el código</button>
    </form>
  </div>

  <div id="paso2">
    <p class="sub" id="aquien">Te mandamos un código de 6 dígitos. Escríbelo aquí — no cierres esta página.</p>
    <form id="f2">
      <label for="codigo">Código</label>
      <input id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9\s]*" maxlength="7" placeholder="••••••" required />
      <button id="b2" type="submit">Entrar</button>
    </form>
    <button class="liga" id="reenviar" type="button">Mandarme otro código</button>
  </div>

  <p class="aviso ok" id="ok"></p>
  <p class="aviso mal" id="mal"></p>
  <a class="regreso" href="/">← Volver al sitio</a>
</main>
<script>
(function () {
  var paso1 = document.getElementById('paso1'), paso2 = document.getElementById('paso2');
  var f1 = document.getElementById('f1'), f2 = document.getElementById('f2');
  var b1 = document.getElementById('b1'), b2 = document.getElementById('b2');
  var ok = document.getElementById('ok'), mal = document.getElementById('mal');
  var reto = '', correo = '';

  function di(el, msg) { el.textContent = msg; el.style.display = 'block'; }
  function limpia() { ok.style.display = 'none'; mal.style.display = 'none'; }

  function pideCodigo(cb) {
    limpia();
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: correo })
    }).then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) {
        if (x.r.ok && x.j.reto) { reto = x.j.reto; cb(true); }
        else if (x.r.status === 429) { di(mal, 'Demasiados intentos. Espera unos minutos.'); cb(false); }
        else { di(mal, 'No se pudo mandar el código. Intenta otra vez en un momento.'); cb(false); }
      }).catch(function () { di(mal, 'No se pudo mandar el código. Revisa tu conexión.'); cb(false); });
  }

  f1.addEventListener('submit', function (ev) {
    ev.preventDefault();
    correo = document.getElementById('email').value.trim();
    b1.disabled = true; b1.textContent = 'Mandando…';
    pideCodigo(function (fue) {
      b1.disabled = false; b1.textContent = 'Mandarme el código';
      if (fue) {
        paso1.style.display = 'none'; paso2.style.display = 'block';
        di(ok, 'Si tu correo tiene acceso, el código va en camino (revisa Spam la primera vez). Vence en 15 minutos.');
        document.getElementById('codigo').focus();
      }
    });
  });

  document.getElementById('reenviar').addEventListener('click', function () {
    pideCodigo(function (fue) {
      if (fue) { di(ok, 'Listo, va otro código. El anterior deja de servir.'); document.getElementById('codigo').focus(); }
    });
  });

  f2.addEventListener('submit', function (ev) {
    ev.preventDefault();
    limpia();
    b2.disabled = true; b2.textContent = 'Revisando…';
    fetch('/api/canje', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reto: reto, codigo: document.getElementById('codigo').value })
    }).then(function (r) {
      if (r.ok) { b2.textContent = 'Entrando…'; location.href = '/panel'; return; }
      b2.disabled = false; b2.textContent = 'Entrar';
      if (r.status === 429) { di(mal, 'Demasiados intentos. Espera unos minutos.'); }
      else { di(mal, 'Ese código no es válido o ya venció. Revísalo o pide otro.'); }
    }).catch(function () {
      b2.disabled = false; b2.textContent = 'Entrar';
      di(mal, 'No se pudo revisar el código. Intenta de nuevo.');
    });
  });
})();
</script>
</body>
</html>
